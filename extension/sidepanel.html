<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>安能助手</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="app">
    <aside id="thread-drawer" class="drawer" hidden>
      <div class="drawer-head">
        <span class="drawer-title">历史会话</span>
        <button type="button" id="btn-close-threads" class="icon-btn" aria-label="关闭">✕</button>
      </div>
      <button type="button" id="btn-new-thread-drawer" class="btn-new-full">＋ 新聊天</button>
      <input type="search" id="session-search" class="session-search" placeholder="搜索会话…" autocomplete="off" />
      <div id="session-list-status" class="session-list-status muted">加载中…</div>
      <ul id="thread-list" class="thread-list"></ul>
    </aside>
    <div id="drawer-scrim" class="scrim" hidden></div>

    <div class="shell">
      <header class="topbar">
        <button type="button" id="btn-threads" class="icon-btn" title="历史" aria-label="历史">☰</button>
        <div class="topbar-brand">
          <span class="brand-name">安能助手</span>
          <span class="brand-divider" aria-hidden="true"></span>
          <div class="topbar-title" id="thread-title">新聊天</div>
        </div>
        <div class="topbar-right">
          <span id="host-dot" class="host-dot unknown" title="Native host"></span>
          <button type="button" id="btn-new" class="icon-btn" title="新聊天" aria-label="新聊天">＋</button>
        </div>
      </header>

      <main id="log" class="feed" aria-live="polite">
        <div id="empty-state" class="empty">
          <div class="empty-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="32" height="32" rx="8" fill="#1E50E6"/>
              <path d="M8 12.5A2.5 2.5 0 0 1 10.5 10h11A2.5 2.5 0 0 1 24 12.5v7a2.5 2.5 0 0 1-2.5 2.5H16l-3.2 2.4a.8.8 0 0 1-1.3-.6V22H10.5A2.5 2.5 0 0 1 8 19.5v-7Z" fill="#fff"/>
              <circle cx="24.5" cy="8.5" r="3.2" fill="#50C8FF"/>
            </svg>
          </div>
          <p>你好，我是安能助手</p>
          <p class="hint">可以提问，也可以录音、识图或读取 PDF</p>
        </div>
      </main>

      <footer class="composer">
        <div id="context-chips" class="chips" hidden></div>

        <div class="composer-box">
          <div id="mention-popup" class="mention-popup" hidden></div>
          <div id="settings-panel" class="popover settings" hidden>
            <div class="popover-head">
              <span>设置</span>
              <button type="button" id="btn-close-settings" class="icon-btn sm" aria-label="关闭">✕</button>
            </div>
            <label class="set-row">
              <span>API 地址</span>
              <input type="url" id="api-base" placeholder="留空=使用随包内置配置" autocomplete="off" />
            </label>
            <label class="set-row">
              <span>API Key</span>
              <input type="password" id="api-key" placeholder="留空=使用随包内置密钥" autocomplete="off" />
            </label>
            <label class="set-row">
              <span>模型</span>
              <input type="text" id="api-model" placeholder="留空=deepseek-v4，选图走 qwen-vl" autocomplete="off" />
            </label>
            <label class="set-check"><input type="checkbox" id="attach-body" checked /> 默认附带页面正文</label>
            <label class="set-check"><input type="checkbox" id="dry-run" /> dry-run（仅调试）</label>
            <label class="set-row">
              <span>工作目录</span>
              <input type="text" id="cwd" placeholder="可选，只记在会话上" autocomplete="off" />
            </label>
            <p class="set-note">会话 <code id="session-id">新</code></p>
            <p class="set-note">默认走公司私有化接口（Rust Host 内加密）。设置项仅作覆盖。</p>
          </div>

          <div id="attach-menu" class="popover attach-menu" hidden>
            <button type="button" data-add-chip="page">当前页</button>
            <button type="button" data-add-chip="selection">选中文本</button>
            <button type="button" data-add-chip="tabs">标签页</button>
            <button type="button" data-add-chip="pageText">强制附加正文</button>
          </div>

          <input id="ocr-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
          <input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden />

          <div class="capability-row" aria-label="快捷能力">
            <button type="button" id="btn-voice" class="capability" title="语音输入" aria-label="语音输入">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 1 0-7 0v6a3.5 3.5 0 0 0 3.5 3.5Z"/><path d="M5.5 11.5v.5a6.5 6.5 0 0 0 13 0v-.5M12 18.5V22M9 22h6"/></svg>
              <span>语音</span>
            </button>
            <button type="button" id="btn-ocr" class="capability" title="图片文字识别" aria-label="图片文字识别">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9h8M8 12h8M8 15h5"/></svg>
              <span>识图</span>
            </button>
            <button type="button" id="btn-pdf" class="capability" title="读取 PDF" aria-label="读取 PDF">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M8 13h8M8 16h8"/></svg>
              <span>PDF</span>
            </button>
            <span id="media-status" class="media-status" role="status" aria-live="polite"></span>
          </div>

          <textarea
            id="input"
            rows="1"
            placeholder="发消息…"
            autocomplete="off"
          ></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <button type="button" id="btn-attach" class="pill" title="附加上下文">＠</button>
              <button type="button" id="btn-settings" class="pill" title="设置">⋯</button>
            </div>
            <div class="composer-right">
              <button type="button" id="btn-cancel" class="send stop" disabled title="停止" hidden>■</button>
              <button type="button" id="btn-send" class="send" title="发送" aria-label="发送">↑</button>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </div>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
